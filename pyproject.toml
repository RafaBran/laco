[project]
name = "laco"
version = "0.0.0"
description = "Laboratório de Análise do Comportamento Online"
requires-python = ">=3.14,<3.15"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["laco-simulator"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
# Usa somente o Python instalado pelo uv, nunca o global da máquina.
python-preference = "only-managed"
required-version = ">=0.13.9"

[tool.uv.workspace]
members = ["packages/simulator"]

[tool.uv.sources]
laco-simulator = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "NPY"]

[tool.mypy]
strict = true
files = ["packages/simulator/src", "packages/simulator/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/simulator/tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
xfail_strict = true
