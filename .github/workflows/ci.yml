name: CI

on:
  push:
    branches: [main]
  pull_request:

# Acesso mínimo: os jobs só leem o repositório.
permissions:
  contents: read

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Falha se o uv.lock não corresponder ao pyproject.toml.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Instalar dependências
        run: uv sync

      - name: Conferir formatação
        run: uv run ruff format --check

      - name: Conferir lint
        run: uv run ruff check --output-format=github

      - name: Conferir tipos
        run: uv run mypy

      - name: Executar testes
        run: uv run pytest

  segredos:
    name: Segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: um segredo removido continua nos commits antigos.
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${arquivo}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${arquivo}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${arquivo}" -C "${RUNNER_TEMP}" gitleaks

      - name: Procurar segredos no histórico
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner .'
